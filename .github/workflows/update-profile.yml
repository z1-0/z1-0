name: Update profile

on:
  schedule:
    - cron: "0 0,16 * * *"
  workflow_dispatch:

concurrency:
  group: update-profile

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        repo:
          - ah.sh
          - skills-nix
          - nix-ast
          - nix-meta
          - srctree-nix
          - metatree-nix
          - nix-bulkfetch-url
          - nixos-config
        theme: [light, dark]
        include:
          - theme: light
            bg: ffffff
            fg: 1f2328
            accent: 0969da
            border: d1d9e0
            emph: 0969da
          - theme: dark
            bg: 0d1117
            fg: f0f6fc
            accent: 4493f8
            border: 3d444d
            emph: 1f6feb
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Prepare dir
        run: mkdir -p assets

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ matrix.repo }}&bg_color=${{ matrix.bg }}&title_color=${{ matrix.accent }}&text_color=${{ matrix.fg }}&icon_color=${{ matrix.emph }}&border_color=${{ matrix.border }}
          path: assets/${{ matrix.repo }}-${{ matrix.theme }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload card
        uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.repo }}-${{ matrix.theme }}
          path: assets/${{ matrix.repo }}-${{ matrix.theme }}.svg
          archive: false
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "*.svg"
          path: assets
          merge-multiple: true

      - name: Generate README in matrix order
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repos=($(awk '/^[[:space:]]*repo:$/{f=1;next} f && /^[[:space:]]*- /{sub(/^[[:space:]]*- /,"");print;next} f{exit}' .github/workflows/update-profile.yml))

          render=()
          for p in "${repos[@]}"; do
            if [[ -e "assets/$p-light.svg" && -e "assets/$p-dark.svg" ]]; then
              render+=("$p")
            fi
          done
          {
            for ((i = 0; i < ${#render[@]}; i++)); do
              p="${render[i]}"
              if ((i % 2 == 1)); then
                printf ' &nbsp;&nbsp;'
              elif ((i > 0)); then
                printf '\n\n'
              fi
              printf '<a href="https://github.com/%s/%s"><picture>' "$OWNER" "$p"
              printf '<source media="(prefers-color-scheme: dark)" srcset="./assets/%s-dark.svg">' "$p"
              printf '<source media="(prefers-color-scheme: light)" srcset="./assets/%s-light.svg">' "$p"
              printf '<img src="./assets/%s-dark.svg" alt="%s"></picture></a>' "$p" "$p"
            done
            printf '\n\n'
          } > README.md

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "\u200B"
